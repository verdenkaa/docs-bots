worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    server_tokens off;
    server {
        listen 80;
        server_name @PUBLIC_HOST@;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 503; }
    }
}
