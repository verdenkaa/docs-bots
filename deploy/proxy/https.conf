worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 256k;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 65;
    server {
        listen 80;
        server_name @PUBLIC_HOST@;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 308 https://@PUBLIC_HOST@$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name @PUBLIC_HOST@;
        ssl_certificate /etc/letsencrypt/live/rag-server/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rag-server/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        set $core http://core:8000;
        set $worker http://worker:8001;
        proxy_http_version 1.1;
        proxy_set_header Host @PUBLIC_HOST@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Preserve original application status codes and let the owners decide retries.
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_cache off;
        location = /proxy-health { access_log off; return 200; }
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }
        location ^~ /internal/ { return 404; }
        location = /telegram/webhook { return 404; }
        location = /admin/ingestion/upload {
            client_max_body_size @UPLOAD_BYTES@;
            client_body_timeout @UPLOAD_TIMEOUT@s;
            proxy_request_buffering off;
            proxy_read_timeout @PROXY_TIMEOUT@s;
            proxy_send_timeout @PROXY_TIMEOUT@s;
            proxy_pass $worker;
        }
        @APP_LOCATIONS@
    }
}
