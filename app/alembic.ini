[alembic]
script_location = %(here)s/rag/runtime/_migrations
prepend_sys_path = %(here)s
path_separator = os

# Connection settings come from RuntimeSettings (environment / local .env).
# Generate: python -m alembic revision --autogenerate -m "describe change"
# Verify:   python -m alembic check
# Apply:    python -m rag.runtime migrate
