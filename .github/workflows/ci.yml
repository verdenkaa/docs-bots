name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: app/.python-version
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.lock
      - name: Install application
        run: python -m pip install -c requirements.lock -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Run ingestion component tests
        run: python -m unittest discover -s rag/ingestion/_tests -v
      - name: Run API component tests
        run: python -m unittest discover -s rag/rag_api/tests -v
      - name: Run container manager tests
        working-directory: container-manager
        run: python -m unittest discover -s tests -v

  runtime-integration:
    name: Runtime integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated infrastructure
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml up -d --wait
      - name: Build test runner
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml build runner
      - name: Run tests against real services
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml run --rm --no-deps -T runner
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml logs --tail 100
      - name: Stop isolated infrastructure
        if: always()
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml down

  docs-tests:
    name: Documentation tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Run documentation tests
        run: npm test
      - name: Build documentation
        run: npm run build

  server-deployment:
    name: Server images and startup checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: app/.python-version
      - name: Install application for configuration tests
        run: python -m pip install -c app/requirements.lock ./app
      - name: Test deployment without real secrets or Telegram
        run: python -m unittest discover -s deploy/tests -v
      - name: Build server application
        run: docker build -t rag-server-check -f deploy/Dockerfile .
      - name: Build CPU model SDK image without downloading weights
        run: docker build -t rag-native-check -f deploy/native/Dockerfile .
      - name: Exercise CPU model SDKs without pretrained weights or network
        run: >-
          docker run --rm --network none --entrypoint python
          -v "$PWD/deploy/tests/check_native_image.py:/opt/native/check_native_image.py:ro" rag-native-check
          /opt/native/check_native_image.py
      - name: Build existing Horizon detector runtime without downloading weights
        run: docker build -t rag-detector-check -f deploy/detector/Dockerfile .
      - name: Check ONNX detector SDK imports
        run: >-
          docker run --rm --network none rag-detector-check
          python -c "import onnxruntime, tokenizers; print('Detector SDK imports passed')"
      - name: Test Linux supervisor inside the production image
        run: >-
          docker run --rm --network none
          -v "$PWD/deploy/tests:/opt/rag/deploy/tests:ro"
          -v "$PWD/deploy/proxy:/opt/rag/deploy/proxy:ro"
          -v "$PWD/deploy/native:/opt/rag/deploy/native:ro"
          rag-server-check python -m unittest discover -s deploy/tests -v
      - name: Build HTTPS proxy
        run: docker build -t rag-proxy-check deploy/proxy
      - name: Start real application roles with isolated stores and synthetic models
        run: python deploy/tests/check_stack.py --image rag-server-check
      - name: Exercise nginx with disposable synthetic TLS and upstreams
        run: >-
          docker run --rm --network none --entrypoint python
          -v "$PWD/deploy/tests/check_proxy_image.py:/check_proxy_image.py:ro"
          rag-proxy-check /check_proxy_image.py
