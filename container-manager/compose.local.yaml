services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
  rabbitmq:
    ports: ["127.0.0.1:${RABBITMQ_PORT:-5672}:5672"]
  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
  s3:
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
