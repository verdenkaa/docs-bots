[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bot"
version = "0.1.0"
description = "Modular Telegram RAG application scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.19.2,<2",
    "aio-pika>=9.5,<10",
    "redis>=5.2,<8",
    "qdrant-client==1.20.0",
    "httpx>=0.28,<1",
    "Pillow==13.0.0",
    "pdfplumber>=0.11,<0.12",
    "pypdf>=7,<8",
]

[project.optional-dependencies]
# Не подключён к Document Converter; установка не расширяет поддержку форматов.
# Для отдельных экспериментов с Docling; тянет torch и не ставится на Alpine (musl).
docling = [
    "docling>=2.150,<3",
]
production = [
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "uvicorn-worker>=0.3,<1; sys_platform != 'win32'",
]

[tool.setuptools.packages.find]
include = ["rag", "rag.*"]

[tool.setuptools.package-data]
"rag.runtime._migrations" = ["script.py.mako"]
