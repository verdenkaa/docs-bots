apiVersion: 1
datasources:
  - name: RAG Business Analytics
    uid: rag-business-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: rag_analytics_reader
    editable: false
    jsonData:
      database: ${ANALYTICS_DATABASE}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 300
    secureJsonData:
      password: $ANALYTICS_PASSWORD
