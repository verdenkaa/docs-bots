name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: app/.python-version
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.lock
      - name: Install application
        run: python -m pip install -c requirements.lock -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Run container manager tests
        working-directory: container-manager
        run: python -m unittest discover -s tests -v

  runtime-integration:
    name: Runtime integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated infrastructure
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml up -d --wait
      - name: Build test runner
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml build runner
      - name: Run tests against real services
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml run --rm --no-deps -T runner
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml logs --tail 100
      - name: Stop isolated infrastructure
        if: always()
        run: docker compose -p rag-runtime-tests -f app/tests/runtime-compose.yaml down

  docs-tests:
    name: Documentation tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Run documentation tests
        run: npm test
      - name: Build documentation
        run: npm run build
